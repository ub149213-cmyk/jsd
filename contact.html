<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Document</title>
</head>
<style>
  .road{
    height: 130px;
    width: 100%;
    background-color: black;
    border-top: 5px dashed white;
    position: absolute;
    bottom: 0;
  }
  body{
    overflow: hidden;
    background: linear-gradient(cyan,navy);
    height: 100vh;margin: 0;
  }
  .car{
    height: 200px;width: 400px;background-color: red;
    position: absolute;bottom: 110px; left: 100px;
    border-radius: 20px 300px 20px 20px ;
    animation: 2s linear infinite be;
  }
  @keyframes be{
    0%{left: -200px;}
    100%{left: 100%;}
  }
  .wheel{
    width: 80px; height: 80px;background-color: black; border-radius: 100%; border: 5px  dotted white;
    position: absolute; bottom: -20px;
    animation: 1s linear infinite b;
  }
  @keyframes b{
    0%{transform: rotate(0deg);}
    100%{transform: rotate(360deg);}
  }
  .right{right: 20px;}
  .left{left: 20px;}
  .moon{
    height: 120px;width: 120px;background-color: white; box-shadow: 0 0 4px white; position: absolute; right: 100px; top: 50px;
    border-radius: 100%; animation: alternate 1s linear infinite sun;
  }
  @keyframes sun{
    0%{transform: scale(1);}
    100%{transform: scale(1.3); box-shadow: 0 0 20px 5px white;}
  }
  .m1{
    height: 0;width: 0;
    border-left: 200px transparent;
    border-right: 0 0 200px transparent;
    position: absolute;
    bottom: 120px;
  }
  .m1{border-bottom: 200px brown ;}

  .cloud{
    height: 50px;width: 100px;
    background-color: white;
    position: absolute; left: 90px; top: 90px; border-radius: 100%;
    box-shadow: 40px 0 white , 20px -20px white;
  }
</style>
<body>

  <div class="cloud"></div>
  <div class="m1"></div>
  <div class="m1"></div>
  <div class="moon"></div>
  <div class="road"></div>
  <div class="car">
    <div class="wheel right"></div>
    <div class="wheel left"></div>
  </div>
  
</body>
</html>
