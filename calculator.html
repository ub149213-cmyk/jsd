<!DOCTYPE html>
<html>
<head>
  <title>Stylish Calculator</title>
  <style>
    body { display:flex; justify-content:center; align-items:center; height:100vh; background:#f0f0f0; }
    .calc { background:#fff; padding:20px; border-radius:10px; box-shadow:0 5px 15px rgba(0,0,0,0.2); }
    #display { width:100%; height:50px; font-size:24px; text-align:right; margin-bottom:10px; padding:5px; }
    .buttons { display:grid; grid-template-columns: repeat(4, 60px); gap:10px; }
    button { height:60px; font-size:20px; border:none; border-radius:5px; cursor:pointer; background:#e0e0e0; }
    button:hover { background:#d0d0d0; }
    .operator { background:#ff9500; color:#fff; }
    .operator:hover { background:#e08900; }
    .equal { background:#34c759; color:#fff; grid-column: span 2; }
    .equal:hover { background:#28a745; }
    .clear { background:#ff3b30; color:#fff; }
    .clear:hover { background:#e03028; }
  </style>
</head>
<body>

<div class="calc">
  <input type="text" id="display" disabled>
  <div class="buttons">
    <button onclick="press('7')">7</button>
    <button oncli
    
    
    ck="press('8')">8</button>
    <button onclick="press('9')">9</button>
    <button class="operator" onclick="press('/')">÷</button>

    <button onclick="press('4')">4</button>
    <button onclick="press('5')">5</button>
    <button onclick="press('6')">6</button>
    <button class="operator" onclick="press('*')">×</button>

    <button onclick="press('1')">1</button>
    <button onclick="press('2')">2</button>
    <button onclick="press('3')">3</button>
    <button class="operator" onclick="press('-')">-</button>

    <button onclick="press('0')">0</button>
    <button onclick="press('.')">.</button>
    <button class="equal" onclick="calc()">=</button>
    <button class="operator" onclick="press('+')">+</button>

    <button class="clear" onclick="clr()">C</button>
  </div>
</div>

<script>
let d = document.getElementById('display');
function press(v){ d.value += v; }
function calc(){ d.value = eval(d.value); }
function clr(){ d.value = ''; }
</script>

</body>
</html>
