<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .m1, .m2{
        height: 0;
        width: 0;
        border-left: 200px solid transparent;
        border-right: 200px solid transparent;
        position: absolute;
        bottom: 100px;
    }
    .m1{border-bottom: 200px brown solid;}
    .m2{border-bottom: 250px brown solid; left: 300px; }


.cloud{ animation: 2s alternate linear infinite be;
    height: 40px;width: 80px;background-color: rgb(7, 5, 5);
    border-radius: 100%; position: absolute; top: 100px;left: 100px; box-shadow: 40px 0 black , 15px -20px black;
    
}
.cloud:nth-child(4){position: absolute; left: 250px;}

@keyframes be{
    0%{transform: translate(400px);}
    100%{transform: translate(0px) scale(2.2);  }
}
</style>

<body>



    <div class="m1"></div>
    <div class="m2"></div>
    <div class="cloud"></div>
    <div class="cloud"></div>
</body>
</html>
